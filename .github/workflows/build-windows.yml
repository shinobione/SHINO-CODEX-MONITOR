name: Build Windows - Codex Periscope and legacy

on:
  push:
    branches: [main, feature/v4.5.1-targeted-motw-fix, feature/v4.6-one-click-update, feature/v4.7-circular-dashboard, feature/v4.8-desktop-experience, feature/v4.9-reliability, feature/v5-data-health]
    tags: []  # No automatic public Release for an unapproved candidate
  pull_request:
    branches: [main, feature/v4.8-desktop-experience, feature/v4.9-reliability, feature/v5.2-codex-periscope]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  windows-build:
    name: Audit + compilation + autotests
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow for animated QA evidence
        if: hashFiles('src/TargetTests.cs') != ''
        shell: pwsh
        run: python -m pip install Pillow
      - name: Verify public package (no personal files / embedded tokens)
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
      - name: Test Windows MOTW clearing on isolated non-executable fixture
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = Join-Path $env:TEMP ('SHINO-MOTW-TEST-' + [guid]::NewGuid().ToString('N') + '.txt')
          try {
            [IO.File]::WriteAllText($probe, 'SHINO test fixture, no user data')
            Set-Content -LiteralPath $probe -Stream Zone.Identifier -Value "[ZoneTransfer]`nZoneId=3" -ErrorAction Stop
            $before = Get-Item -LiteralPath $probe -Stream Zone.Identifier -ErrorAction Stop
            if (!$before) { throw 'Fixture MOTW not written' }
            Unblock-File -LiteralPath $probe -ErrorAction Stop
            $after = Get-Item -LiteralPath $probe -Stream Zone.Identifier -ErrorAction SilentlyContinue
            if ($after) { throw 'Unblock-File did not clear MOTW' }
            Write-Host 'PASS: isolated MOTW fixture was unblocked'
          }
          finally {
            Remove-Item -LiteralPath $probe -Force -ErrorAction SilentlyContinue
          }
      - name: Build appropriate version and run 98 C# self-tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $assembly = [IO.File]::ReadAllText((Join-Path $PWD 'src\AssemblyInfo.cs'))
          if ($assembly.Contains('AssemblyVersion("5.2.0.0")')) {
            & .\BUILD-PERISCOPE-V5.2.ps1
          }
          elseif ($assembly.Contains('AssemblyVersion("5.1.0.0")') -and
              $assembly.Contains('AssemblyInformationalVersion("5.1.0")')) {
            & .\BUILD-RELEASE-V5.1.ps1
          }
          else {
            & .\BUILD-RELEASE-V5.0.ps1
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify every Preview ZIP entry and checksum (NO INSTALL)
        if: hashFiles('BUILD-PERISCOPE-V5.2.ps1') != ''
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $PWD 'dist/CODEX_PERISCOPE_V5_2_PREVIEW_WINDOWS.zip'
          python -m zipfile -t $archive
          if ($LASTEXITCODE -ne 0) { throw 'Preview ZIP CRC validation failed.' }
          $item = Get-Item -LiteralPath $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          Write-Host "Preview ZIP size=$($item.Length) bytes; SHA-256=$hash; all entry CRC checks passed."
      - name: Record repeated-refresh native composition evidence (synthetic)
        if: hashFiles('src/TargetTests.cs') != ''
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'bin/SHINO-CODEX-MONITOR.exe'
          $proc = Start-Process -FilePath $exe -ArgumentList '--target-video' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw 'Repeated-refresh capture failed.' }
          foreach ($layout in @('Vertical','Compact')) {
            $folder = Join-Path $PWD "bin/motion/$layout"
            $rows = @(Import-Csv (Join-Path $folder 'frames.csv'))
            if ($rows.Count -lt 100) { throw "$layout video has too few frames." }
            if (@($rows | Where-Object { [int]$_.parent_events -ne 0 -or [int]$_.handle_events -ne 0 -or [int]$_.material_events -ne 0 }).Count -ne 0) {
              throw "$layout refreshed frames contain parent, HWND, or material changes."
            }
            if (@($rows | Select-Object -ExpandProperty missions -Unique).Count -lt 2) { throw "$layout video did not show both mission counts." }
            $measurement = [IO.File]::ReadAllText((Join-Path $folder 'measurement.txt'))
            if (!$measurement.Contains('blank quota/mission samples=0')) { throw "$layout video has blank sampled content." }
            Write-Host "${layout}: $($rows.Count) sampled frames; no in-frame reparent, HWND, or material changes."
          }
          $gifScript = @'
          from pathlib import Path
          from PIL import Image
          root = Path("bin/motion")
          for layout in ("Vertical", "Compact"):
              paths = sorted((root / layout).glob("[0-9]*.png"))[::3]
              frames = [Image.open(path).convert("RGB") for path in paths]
              frames[0].save(root / layout / "anti-blink.gif", save_all=True, append_images=frames[1:], duration=100, loop=0, optimize=True)
              for frame in frames: frame.close()
          '@
          $gifScriptPath = Join-Path $env:TEMP ('periscope-motion-' + [guid]::NewGuid().ToString('N') + '.py')
          [IO.File]::WriteAllText($gifScriptPath,$gifScript,(New-Object System.Text.UTF8Encoding($false)))
          python $gifScriptPath
          if ($LASTEXITCODE -ne 0) { throw 'Animated QA GIF encoding failed.' }
      - name: Test 46 full-turn, subagent, diagnostic and notification fixtures
        if: hashFiles('src/LiveTaskTests.cs') != ''
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'bin\\SHINO-CODEX-MONITOR.exe'
          $report = Join-Path $PWD 'bin\\V5_TASK_TEST_REPORT.txt'
          if (Test-Path -LiteralPath $report) { Remove-Item -LiteralPath $report -Force }
          $proc = Start-Process -FilePath $exe -ArgumentList '--live-task-self-test' -Wait -PassThru
          if ($proc.ExitCode -ne 0 -or !(Test-Path -LiteralPath $report)) {
            throw 'Task observer tests did not run or failed.'
          }
          $content = [IO.File]::ReadAllText($report)
          Write-Host $content
          if (!$content.Contains('46/46') -or $content.Contains('FAIL ')) {
            throw 'Live task lifecycle validation failed.'
          }
      - name: Measure native synthetic radar performance (no live collectors)
        if: hashFiles('src/PremiumTests.cs') != ''
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'bin/SHINO-CODEX-MONITOR.exe'
          $report = Join-Path $PWD 'bin/PREMIUM_PERFORMANCE_REPORT.txt'
          if (Test-Path -LiteralPath $report) { Remove-Item -LiteralPath $report -Force }
          $proc = Start-Process -FilePath $exe -ArgumentList '--premium-performance' -WindowStyle Hidden -Wait -PassThru
          if ($proc.ExitCode -ne 0 -or !(Test-Path -LiteralPath $report)) { throw 'Native benchmark did not complete.' }
          Get-Content -LiteralPath $report
      - name: Measure three-radar performance (synthetic, no live readers)
        if: hashFiles('src/P0Tests.cs') != ''
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'bin/SHINO-CODEX-MONITOR.exe'
          $report = Join-Path $PWD 'bin/P0_PERFORMANCE_REPORT.txt'
          if (Test-Path -LiteralPath $report) { Remove-Item -LiteralPath $report -Force }
          $proc = Start-Process -FilePath $exe -ArgumentList '--p0-performance' -WindowStyle Hidden -Wait -PassThru
          if ($proc.ExitCode -ne 0 -or !(Test-Path -LiteralPath $report)) { throw 'P0 benchmark did not complete.' }
          Get-Content -LiteralPath $report
      - name: Measure full-window native rendering and handle disposal (synthetic)
        if: hashFiles('src/InstrumentTests.cs') != ''
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'bin/SHINO-CODEX-MONITOR.exe'
          $report = Join-Path $PWD 'bin/INSTRUMENT_PERFORMANCE_REPORT.txt'
          if (Test-Path -LiteralPath $report) { Remove-Item -LiteralPath $report -Force }
          $proc = Start-Process -FilePath $exe -ArgumentList '--instrument-performance' -WindowStyle Hidden -Wait -PassThru
          if ($proc.ExitCode -ne 0 -or !(Test-Path -LiteralPath $report)) { throw 'Full-window benchmark failed.' }
          Get-Content -LiteralPath $report
      - name: Download prior PR preview for same-runner comparison
        if: github.event_name == 'pull_request' && hashFiles('BUILD-PERISCOPE-V5.2.ps1') != ''
        uses: actions/download-artifact@v4
        with:
          name: CODEX-PERISCOPE-V5.2-PREVIEW-WINDOWS
          run-id: 39508124127
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: bin/previous-candidate
      - name: Measure previous candidate (synthetic, same runner)
        if: github.event_name == 'pull_request' && hashFiles('BUILD-PERISCOPE-V5.2.ps1') != ''
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $PWD 'bin/previous-candidate/CODEX_PERISCOPE_V5_2_PREVIEW_WINDOWS.zip'
          $expanded = Join-Path $PWD 'bin/previous-candidate/package'
          Expand-Archive -LiteralPath $package -DestinationPath $expanded -Force
          $exe = Join-Path $expanded 'SHINO-CODEX-MONITOR.exe'
          foreach ($argument in @('--instrument-performance','--parity-performance')) {
            $proc = Start-Process -FilePath $exe -ArgumentList $argument -WindowStyle Hidden -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "Previous candidate benchmark failed: $argument" }
            if ($argument -eq '--instrument-performance') { $name = 'INSTRUMENT' } else { $name = 'PARITY' }
            $source = Join-Path $expanded ($name + '_PERFORMANCE_REPORT.txt')
            if (!(Test-Path -LiteralPath $source)) { throw "Previous candidate report missing: $source" }
            Copy-Item -LiteralPath $source -Destination (Join-Path $PWD ("bin/BASELINE_" + $name + '_PERFORMANCE_REPORT.txt')) -Force
          }
      - name: Measure opt-in Obsidian native composition (synthetic)
        if: hashFiles('src/InstrumentTests.cs') != ''
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'bin/SHINO-CODEX-MONITOR.exe'
          $report = Join-Path $PWD 'bin/PARITY_PERFORMANCE_REPORT.txt'
          $proc = Start-Process -FilePath $exe -ArgumentList '--parity-performance' -WindowStyle Hidden -Wait -PassThru
          if ($proc.ExitCode -ne 0 -or !(Test-Path -LiteralPath $report)) { throw 'Obsidian benchmark failed.' }
          Get-Content -LiteralPath $report
      - name: Compare previous and current candidates under identical conditions
        if: github.event_name == 'pull_request' && hashFiles('BUILD-PERISCOPE-V5.2.ps1') != ''
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = New-Object System.Text.StringBuilder
          function Read-Metrics($text) {
            $render = [regex]::Match($text,'Visible: .*?FPS=([0-9.]+); CPU total-machine=([0-9.]+)%')
            $memory = [regex]::Match($text,'Visible RAM working MiB=([0-9.]+); private MiB=([0-9.]+); GDI=([0-9]+); USER=([0-9]+)')
            $cycles = [regex]::Match($text,'80 full-window create/scale/render/dispose cycles: GDI ([0-9]+) -> ([0-9]+); USER ([0-9]+) -> ([0-9]+)')
            if (!$render.Success -or !$memory.Success -or !$cycles.Success) { throw 'Benchmark report is missing comparable metrics.' }
            return @{ FPS=[double]$render.Groups[1].Value; CPU=[double]$render.Groups[2].Value; Working=[double]$memory.Groups[1].Value; Private=[double]$memory.Groups[2].Value; GDI=[int]$memory.Groups[3].Value; USER=[int]$memory.Groups[4].Value; CycleGDIStart=[int]$cycles.Groups[1].Value; CycleGDIEnd=[int]$cycles.Groups[2].Value; CycleUSERStart=[int]$cycles.Groups[3].Value; CycleUSEREnd=[int]$cycles.Groups[4].Value }
          }
          foreach ($pair in @(@('BASELINE_INSTRUMENT_PERFORMANCE_REPORT.txt','INSTRUMENT_PERFORMANCE_REPORT.txt','Classic / complete circular window'),@('BASELINE_PARITY_PERFORMANCE_REPORT.txt','PARITY_PERFORMANCE_REPORT.txt','Obsidian / circular window'))) {
            $baseline = [IO.File]::ReadAllText((Join-Path $PWD ("bin/" + $pair[0])))
            $candidate = [IO.File]::ReadAllText((Join-Path $PWD ("bin/" + $pair[1])))
            $before = Read-Metrics $baseline
            $after = Read-Metrics $candidate
            [void]$output.AppendLine($pair[2] + ' — synthetic; same Windows runner; sequential runs')
            [void]$output.AppendLine('PREVIOUS: ' + ($baseline.Trim() -replace "`r?`n", ' | '))
            [void]$output.AppendLine('CURRENT:  ' + ($candidate.Trim() -replace "`r?`n", ' | '))
            [void]$output.AppendLine(('DELTA: FPS {0:+0.00;-0.00;0.00}; CPU {1:+0.000;-0.000;0.000} percentage points; working RAM {2:+0.00;-0.00;0.00} MiB; private RAM {3:+0.00;-0.00;0.00} MiB; visible GDI {4:+0;-0;0}; visible USER {5:+0;-0;0}; cycle GDI {6}->{7}; cycle USER {8}->{9}' -f ($after.FPS-$before.FPS),($after.CPU-$before.CPU),($after.Working-$before.Working),($after.Private-$before.Private),($after.GDI-$before.GDI),($after.USER-$before.USER),$after.CycleGDIStart,$after.CycleGDIEnd,$after.CycleUSERStart,$after.CycleUSEREnd))
            [void]$output.AppendLine()
          }
          $comparison = Join-Path $PWD 'bin/PERFORMANCE_COMPARISON.txt'
          [IO.File]::WriteAllText($comparison,$output.ToString())
          Get-Content -LiteralPath $comparison
      - name: Upload synthetic UI evidence and native reports
        if: always() && hashFiles('src/PremiumTests.cs') != ''
        uses: actions/upload-artifact@v4
        with:
          name: CODEX-PERISCOPE-V5.2-SYNTHETIC-QA
          path: |
            bin/premium-qa/*.png
            bin/PREMIUM_TEST_REPORT.txt
            bin/PREMIUM_PERFORMANCE_REPORT.txt
            bin/V4_TEST_REPORT.txt
            bin/V5_TASK_TEST_REPORT.txt
            bin/p0-qa/*.png
            bin/P0_TEST_REPORT.txt
            bin/P0_PROGRESS.txt
            bin/P0_PERFORMANCE_REPORT.txt
            bin/instrument-qa/after/*.png
            bin/instrument-qa/parity/*.png
            bin/target-qa/*.png
            bin/motion/**/*.png
            bin/motion/**/*.gif
            bin/motion/**/*.csv
            bin/motion/**/measurement.txt
            bin/motion/**/stable-window-events.txt
            bin/TARGET_TEST_REPORT.txt
            bin/PARITY_PERFORMANCE_REPORT.txt
            bin/INSTRUMENT_TEST_REPORT.txt
            bin/INSTRUMENT_PERFORMANCE_REPORT.txt
            bin/PERFORMANCE_COMPARISON.txt
            bin/BASELINE_INSTRUMENT_PERFORMANCE_REPORT.txt
            bin/BASELINE_PARITY_PERFORMANCE_REPORT.txt
          if-no-files-found: error
          retention-days: 30
      - name: Smoke test actual GitHub Release download (NO INSTALL)
        # Legacy live release endpoint returned HTTP 403 on this PR runner.
        # Keep release download gating on main; PR preview is unrelated to updating.
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'bin\\SHINO-CODEX-MONITOR.exe'
          $report = Join-Path $PWD 'bin\\V4_UPDATE_DOWNLOAD_REPORT.txt'
          if (Test-Path -LiteralPath $report) { Remove-Item -LiteralPath $report -Force }
          $proc = Start-Process -FilePath $exe -ArgumentList '--update-download-smoke' -Wait -PassThru
          if ($proc.ExitCode -ne 0 -or !(Test-Path -LiteralPath $report)) {
            if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report }
            throw 'Live download smoke test failed. No installation was performed.'
          }
          $content = [IO.File]::ReadAllText($report)
          Write-Host $content
          if (!$content.Contains('PASS: real GitHub Release download and SHA-256/ZIP validation') -or
              !$content.Contains('Installer: NOT EXECUTED')) {
            throw 'Live download smoke report invalid.'
          }
      - name: Upload V5.2 Codex Periscope portable preview (NO INSTALL)
        if: hashFiles('BUILD-PERISCOPE-V5.2.ps1') != ''
        uses: actions/upload-artifact@v4
        with:
          name: CODEX-PERISCOPE-V5.2-PREVIEW-WINDOWS
          path: dist/CODEX_PERISCOPE_V5_2_PREVIEW_WINDOWS.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload stable V5.1 installer ZIP (validated; no installation)
        if: hashFiles('BUILD-PERISCOPE-V5.2.ps1') == '' && hashFiles('INSTALLER-V5.1.ps1') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SHINO-CODEX-MONITOR-V5.1.0-STABLE-WINDOWS-PR
          path: dist/SHINO_CODEX_MONITOR_V5_1_WINDOWS.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload V5.0 stable artifact (legacy branch only)
        if: hashFiles('INSTALLER-V5.1.ps1') == '' && hashFiles('src/LiveTaskTests.cs') == ''
        uses: actions/upload-artifact@v4
        with:
          name: SHINO-CODEX-MONITOR-v5.0-Windows
          path: dist/SHINO_CODEX_MONITOR_V5_0_WINDOWS.zip
          if-no-files-found: error
          retention-days: 30
