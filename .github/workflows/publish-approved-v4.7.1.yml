name: Publish approved SHINO Codex Monitor v4.7.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-approved-v4.7.1.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish-approved-v4-7-1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: e07f57d34e2d74ea1e0bc657218b45811d38a850
      TESTED_RUN: "39036421090"
      TAG: v4.7.1
      ARTIFACT_NAME: SHINO-CODEX-MONITOR-v4.7-Windows
      ARCHIVE: SHINO_CODEX_MONITOR_V4_7_WINDOWS.zip
    steps:
      - name: Confirm approved repository and exact green Windows CI
        shell: bash
        run: |
          set -euo pipefail
          test "$GH_REPO" = "shinobione/SHINO-CODEX-MONITOR"
          test "$(gh api "repos/$GH_REPO/actions/runs/$TESTED_RUN" --jq '.head_sha')" = "$SOURCE_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$TESTED_RUN" --jq '.conclusion')" = "success"
          test "$(gh api "repos/$GH_REPO/actions/runs/$TESTED_RUN" --jq '.head_branch')" = "main"
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "REFUS : tag deja present, aucun ecrasement"; exit 1
          fi
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "REFUS : release deja presente, aucun ecrasement"; exit 1
          fi

      - name: Download precompiled ZIP from tested main run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download "$TESTED_RUN" --repo "$GH_REPO" \
            --name "$ARTIFACT_NAME" --dir release
          test -s "release/$ARCHIVE"

      - name: Independently verify ZIP structure, EXE SHA-256 and documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, re, zipfile
          archive = pathlib.Path('release/SHINO_CODEX_MONITOR_V4_7_WINDOWS.zip')
          expected = {
              'SHINO-CODEX-MONITOR.exe', 'SHINO-CODEX.ico',
              'INSTALLER-V4.7.bat', 'INSTALLER-V4.7.ps1',
              'DESINSTALLER-V4.7.ps1', 'SHA256SUMS.txt', 'README-FR.txt'
          }
          with zipfile.ZipFile(archive) as z:
              if z.testzip() is not None:
                  raise SystemExit('Archive invalide')
              names = {}
              for item in z.infolist():
                  if item.is_dir():
                      continue
                  parts = item.filename.replace('\\', '/').split('/')
                  if len(parts) == 1:
                      name = parts[0]
                  elif len(parts) == 2 and parts[0] == 'SHINO_CODEX_MONITOR_V4_7_WINDOWS':
                      name = parts[1]
                  else:
                      raise SystemExit('Chemin ZIP non autorise : ' + item.filename)
                  if name not in expected or name in names:
                      raise SystemExit('Fichier inattendu ou duplique : ' + name)
                  if (item.external_attr >> 16) & 0xF000 == 0xA000:
                      raise SystemExit('Lien symbolique refuse')
                  names[name] = item.filename
              if set(names) != expected:
                  raise SystemExit('Contenu ZIP incomplet : ' + str(set(expected)-set(names)))
              manifest = z.read(names['SHA256SUMS.txt']).decode('utf-8-sig')
              matches = re.findall(r'(?im)^([a-f0-9]{64})\s+SHINO-CODEX-MONITOR\.exe\s*$', manifest)
              if len(matches) != 1:
                  raise SystemExit('Empreinte du binaire absente ou dupliquee')
              exe = z.read(names['SHINO-CODEX-MONITOR.exe'])
              if not exe.startswith(b'MZ'):
                  raise SystemExit('Binaire Windows non reconnu')
              digest = hashlib.sha256(exe).hexdigest()
              if digest.lower() != matches[0].lower():
                  raise SystemExit('SHA-256 du binaire incorrect')
              if b'76/76' not in z.read(names['INSTALLER-V4.7.ps1']):
                  raise SystemExit('Installateur non synchronise avec les tests')
              if b'4.7.1' not in z.read(names['README-FR.txt']):
                  raise SystemExit('README-FR obsolet')
              print('PASS: ZIP complet et SHA-256 valide ; EXE bytes =', len(exe))
          print('Archive sha256:', hashlib.sha256(archive.read_bytes()).hexdigest())
          PY

      - name: Publish public GitHub Release v4.7.1
        shell: bash
        run: |
          set -euo pipefail
          cat > release/NOTES.md <<'EOF'
          ## SHINO // CODEX MONITOR v4.7.1 — Circular Dashboard

          - **Quotas Codex ChatGPT** : pourcentages restants 5 h / semaine, resets (lorsqu'ils sont exposes), fraicheur des releves et etat source.
          - **Circular Dashboard** : deux roues rapprochees, plus lisibles, et anciens modes Vertical / Compact / Micro preserves.
          - **Seuils** : 76-100 % violet, 51-75 % turquoise, 26-50 % dore, 11-25 % orange, 0-10 % rouge.
          - **Apparence** : opacite configurable de 70 a 100 %, quatre fonds sombres et fond personnalise.
          - **Micro-widget** : correction de la collision entre pourcentage hebdomadaire et bouton fermer.
          - **Resets en usage bloque** : ne cachent plus le reset futur reel lorsque Codex l'expose, tout en conservant l'alerte de blocage.
          - **Mises a jour** : verification GitHub et telechargement avec confirmation explicite, SHA-256 GitHub et verification de l'archive.
          - Conservation des preferences et de l'historique locaux.

          **Validation** : build GitHub Actions Windows (main, commit e07f57d) : **60/60 tests Python + 76/76 autotests C# PASS**. Interface V4.7.1 testee sur un PC utilisateur *avant* le dernier correctif de reset ; comportement du reset bloque non encore revalide en situation reelle.

          **Installation Windows** : telecharger `SHINO_CODEX_MONITOR_V4_7_WINDOWS.zip`, decompresser, puis lancer `INSTALLER-V4.7.bat` apres avoir quitte le widget actuel. Aucun droit administrateur necessaire.

          **Securite et limites** : programme communautaire non officiel, executable **non signe**. Des avertissements Chrome/Windows sont possibles ; ne desactivez pas leurs protections pour forcer un telechargement. L'empreinte SHA-256 permet un controle d'integrite, pas une authentification du developpeur. L'acces aux quotas repose sur une methode locale Codex CLI dont la disponibilite peut evoluer.
          EOF
          gh release create "$TAG" "release/$ARCHIVE" \
            --repo "$GH_REPO" --target "$SOURCE_SHA" \
            --title "SHINO // CODEX MONITOR v4.7.1" \
            --notes-file release/NOTES.md

      - name: Confirm release points to approved tested SHA with Windows asset
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SOURCE_SHA"
          gh release view "$TAG" --repo "$GH_REPO" \
            --json url,isDraft,isPrerelease,assets \
            --jq '.url, (.assets[] | select(.name == "SHINO_CODEX_MONITOR_V4_7_WINDOWS.zip") | .name)'
