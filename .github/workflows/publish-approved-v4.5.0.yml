name: Publish approved SHINO Codex Monitor v4.5.0
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-approved-v4.5.0.yml

permissions:
  actions: read
  contents: write

jobs:
  publish-v4-5-0:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      EXPECTED_SHA: 93da3a4dd97f8792b1991b2991e871d060b9a13e
      TESTED_RUN: "38813575011"
      ASSET_NAME: SHINO_CODEX_MONITOR_V4_5_WINDOWS.zip
      TAG: v4.5.0
    steps:
      - name: Confirm approved source, tested build and no existing release
        shell: bash
        run: |
          set -euo pipefail
          test "$GH_REPO" = "shinobione/SHINO-CODEX-MONITOR"
          SHA="$(gh api "repos/$GH_REPO/actions/runs/$TESTED_RUN" --jq '.head_sha')"
          RESULT="$(gh api "repos/$GH_REPO/actions/runs/$TESTED_RUN" --jq '.conclusion')"
          test "$SHA" = "$EXPECTED_SHA"
          test "$RESULT" = "success"
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing tag"; exit 1
          fi
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release"; exit 1
          fi
      - name: Download artifact produced by approved Windows build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download "$TESTED_RUN" --repo "$GH_REPO" \
            --name SHINO-CODEX-MONITOR-v4.5-Windows --dir release
          test -s "release/$ASSET_NAME"
      - name: Validate Windows ZIP and embedded SHA-256 before publishing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import pathlib
          import re
          import zipfile

          filename = pathlib.Path('release/SHINO_CODEX_MONITOR_V4_5_WINDOWS.zip')
          with zipfile.ZipFile(filename) as archive:
              if archive.testzip() is not None:
                  raise SystemExit('Archive ZIP corrompue')
              names = archive.namelist()
              # Windows Compress-Archive can place files at ZIP root or under
              # a staging directory. Only exact basenames are allowed.
              def basename(path):
                  return path.replace('\\', '/').rsplit('/', 1)[-1]
              executables = [n for n in names if basename(n) == 'SHINO-CODEX-MONITOR.exe']
              checksums = [n for n in names if basename(n) == 'SHA256SUMS.txt']
              installers = [n for n in names if basename(n) == 'INSTALLER-V4.5.bat']
              if len(executables) != 1 or len(checksums) != 1 or len(installers) != 1:
                  raise SystemExit('Contenu du paquet Windows incorrect. Fichiers : ' + ', '.join(names))
              checksum_text = archive.read(checksums[0]).decode('utf-8-sig')
              match = re.search(r'(?im)^([0-9a-f]{64})\s+SHINO-CODEX-MONITOR\.exe\s*$', checksum_text)
              if not match:
                  raise SystemExit('Empreinte SHA-256 manquante')
              actual = hashlib.sha256(archive.read(executables[0])).hexdigest()
              if actual.lower() != match.group(1).lower():
                  raise SystemExit('Empreinte SHA-256 incorrecte')
              print('Verified Windows ZIP and embedded exe SHA-256')
          PY
      - name: Publish v4.5.0 from exact Windows-tested source commit
        shell: bash
        run: |
          set -euo pipefail
          cat > release/NOTES.md <<'EOF'
          ## SHINO // CODEX MONITOR v4.5.0
          - Vérification manuelle des nouvelles Releases GitHub, depuis le menu de notification Windows.
          - Comparaison sûre avec la version installée, sans installation automatique.
          - Lecture seule des Releases publiques ; aucune donnée de connexion Codex envoyée à GitHub.
          - Collecte des quotas, historique, alertes et préférences conservés.
          
          **Contrôles CI Windows :** 23/23 tests Python et 45/45 autotests C# réussis pour le commit `93da3a4`.
          
          Exécutable non signé. Codex CLI doit être installé et connecté sur Windows.
          EOF
          gh release create "$TAG" "release/$ASSET_NAME" \
            --repo "$GH_REPO" \
            --target "$EXPECTED_SHA" \
            --title "SHINO // CODEX MONITOR v4.5.0" \
            --notes-file release/NOTES.md
      - name: Confirm release URL, tag target and Windows asset
        shell: bash
        run: |
          set -euo pipefail
          TAG_SHA="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$TAG_SHA" = "$EXPECTED_SHA"
          gh release view "$TAG" --repo "$GH_REPO" --json assets,url \
            --jq '.url, (.assets[] | select(.name == "SHINO_CODEX_MONITOR_V4_5_WINDOWS.zip") | .name)'
